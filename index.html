<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loop</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="favicon.png">
    <meta name="apple-mobile-web-app-title" content="Loop">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6e56cf">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --background: oklch(0.9730 0.0133 286.1503);
            --foreground: oklch(0.3015 0.0572 282.4176);
            --muted-foreground: oklch(0.5426 0.0465 284.7435);
            --border: oklch(0.9115 0.0216 285.9625);
            --accent: oklch(0.9221 0.0373 262.1410);
            --primary: oklch(0.5417 0.1790 288.0332);
            --radius: 0.5rem;
            --font-sans: 'Inter', sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --background: oklch(0.1743 0.0227 283.7998);
                --foreground: oklch(0.9185 0.0257 285.8834);
                --muted-foreground: oklch(0.7166 0.0462 285.1741);
                --border: oklch(0.3261 0.0597 282.5832);
                --accent: oklch(0.3354 0.0828 280.9705);
                --primary: oklch(0.7162 0.1597 290.3962);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--background);
            min-height: 100vh;
            color: var(--foreground);
            padding: 24px;
        }

        .page {
            max-width: 640px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 48px;
        }

        h1 {
            font-size: 1.125rem;
            font-weight: 700;
            color: var(--primary);
            line-height: 1.2;
        }

        .refresh-btn {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            padding: 0;
            border: 1px solid var(--border);
            background: var(--background);
            color: var(--foreground);
            cursor: pointer;
            border-radius: var(--radius);
            transition: background-color 0.2s ease;
        }

        .refresh-btn:hover {
            background: var(--accent);
            color: var(--primary);
        }

        .refresh-btn:active {
            background: var(--border);
        }

        .refresh-btn svg {
            width: 20px;
            height: 20px;
        }

        .pull-refresh-indicator {
            position: fixed;
            top: 0;
            left: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background-color: #fff;
            box-shadow: 0 2px 8px rgba(28, 27, 31, 0.16);
            color: #6750A4;
            opacity: 0;
            transform: translate(-50%, -60px);
            pointer-events: none;
            z-index: 100;
        }

        .pull-refresh-indicator.snap {
            transition: transform 0.25s ease, opacity 0.2s ease;
        }

        .pull-refresh-indicator svg {
            width: 20px;
            height: 20px;
            transition: transform 0.15s ease;
        }

        .pull-refresh-indicator.ready svg {
            transform: scale(1.15);
        }

        .pull-refresh-indicator.spinning svg {
            animation: pull-refresh-spin 0.7s linear infinite;
        }

        @keyframes pull-refresh-spin {
            to {
                transform: rotate(360deg);
            }
        }

        .theme-label {
            font-size: 0.6875rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted-foreground);
            margin-bottom: 12px;
            transition: opacity 0.15s ease;
        }

        .prompt-text {
            font-size: 2.75rem;
            font-weight: 700;
            line-height: 1.05;
            color: var(--foreground);
            letter-spacing: -0.02em;
            overflow-wrap: break-word;
            transition: opacity 0.15s ease;
        }

        @media (min-width: 768px) {
            body {
                padding: 40px 48px;
            }

            .page {
                max-width: 900px;
                margin: 0;
            }

            h1 {
                font-size: 1.375rem;
            }

            .prompt-text {
                font-size: 4.5rem;
            }
        }

        @media (min-width: 1280px) {
            body {
                padding: 56px 64px;
            }

            .page {
                max-width: 1100px;
            }

            h1 {
                font-size: 1.5rem;
            }

            .prompt-text {
                font-size: 6.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="pull-refresh-indicator" id="pullRefreshIndicator" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
            <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
            <path d="M16 16h5v5"/>
        </svg>
    </div>

    <div class="page">
        <header class="header">
            <h1>Loop</h1>
            <button class="refresh-btn" type="button" onclick="getRandomPrompt()" aria-label="Next prompt">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                    <path d="M3 3v5h5"/>
                    <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
                    <path d="M16 16h5v5"/>
                </svg>
            </button>
        </header>

        <p id="themeLabel" class="theme-label"></p>

        <p id="promptContent" class="prompt-text"></p>
    </div>

    <script>
        let allPrompts = [];

        function loadPrompts() {
            fetch('prompts.json')
                .then(r => r.json())
                .then(data => {
                    allPrompts = data.prompts || (Array.isArray(data) ? data : []);
                    if (allPrompts.length > 0) getRandomPrompt();
                })
                .catch(err => console.error('Error loading prompts:', err));
        }

        function getRandomPrompt() {
            if (allPrompts.length === 0) return;

            const randomIndex = Math.floor(Math.random() * allPrompts.length);
            displayPrompt(allPrompts[randomIndex]);
        }

        function displayPrompt(prompt) {
            if (!prompt) return;

            const promptContent = document.getElementById('promptContent');
            const themeLabel = document.getElementById('themeLabel');

            promptContent.style.opacity = '0';
            themeLabel.style.opacity = '0';

            setTimeout(() => {
                promptContent.textContent = prompt.prompt;
                themeLabel.textContent = prompt.theme.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
                promptContent.style.opacity = '';
                themeLabel.style.opacity = '';
            }, 150);
        }

        loadPrompts();

        (function setupPullToRefresh() {
            const indicator = document.getElementById('pullRefreshIndicator');
            const threshold = 70;
            const maxPull = 100;
            const hiddenOffset = -60;
            let startY = 0;
            let currentPull = 0;
            let tracking = false;
            let refreshing = false;

            function scrollTop() {
                return window.scrollY || document.documentElement.scrollTop || 0;
            }

            function setPull(pull) {
                currentPull = pull;
                const offset = hiddenOffset + Math.min(pull, maxPull);
                indicator.style.transform = `translate(-50%, ${offset}px)`;
                indicator.style.opacity = String(Math.min(pull / threshold, 1));
                indicator.classList.toggle('ready', pull >= threshold);
            }

            function reset() {
                tracking = false;
                currentPull = 0;
                indicator.classList.add('snap');
                indicator.classList.remove('ready');
                indicator.style.transform = `translate(-50%, ${hiddenOffset}px)`;
                indicator.style.opacity = '0';
            }

            document.addEventListener('touchstart', (e) => {
                if (refreshing || scrollTop() > 0) {
                    tracking = false;
                    return;
                }

                startY = e.touches[0].clientY;
                tracking = true;
                indicator.classList.remove('snap');
            }, { passive: true });

            document.addEventListener('touchmove', (e) => {
                if (!tracking || refreshing) return;

                const delta = e.touches[0].clientY - startY;
                if (delta <= 0 || scrollTop() > 0) {
                    reset();
                    return;
                }

                e.preventDefault();
                setPull(delta * 0.5);
            }, { passive: false });

            document.addEventListener('touchend', () => {
                if (!tracking || refreshing) return;
                tracking = false;

                if (currentPull >= threshold) {
                    refreshing = true;
                    indicator.classList.add('snap', 'spinning');
                    setPull(threshold);

                    setTimeout(() => {
                        getRandomPrompt();
                        setTimeout(() => {
                            refreshing = false;
                            indicator.classList.remove('spinning');
                            reset();
                        }, 350);
                    }, 250);
                } else {
                    reset();
                }
            });

            document.addEventListener('touchcancel', () => {
                if (tracking && !refreshing) reset();
            });
        })();
    </script>
</body>
</html>
